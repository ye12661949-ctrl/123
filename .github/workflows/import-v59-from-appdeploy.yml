name: Import complete AppDeploy v59

on:
  push:
    branches: [v59-full]
    paths: ['.github/workflows/import-v59-from-appdeploy.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v59-full
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download exact AppDeploy source export
        run: |
          set -euo pipefail
          curl -fSL --retry 5 --retry-delay 2 \
            'https://practice-index-vqa2wb.v2.appdeploy.ai/source-export.json' \
            -o /tmp/source-export.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/source-export.json','utf8'));console.log('exported files:',Object.keys(x).length);console.log(Object.keys(x).sort().join('\n'));if(!x['src/App.tsx']||x['src/App.tsx'].split('\n').length<900)process.exit(2);"

      - name: Replace repository app source from export
        run: |
          set -euo pipefail
          cp vite.config.ts /tmp/v59-vite.config.ts
          rm -rf src tests
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const files = JSON.parse(fs.readFileSync('/tmp/source-export.json', 'utf8'));
          let count = 0;
          for (const [name, content] of Object.entries(files)) {
            if (name === 'vite.config.ts') continue;
            if (name.startsWith('node_modules/') || name.startsWith('dist/') || name.startsWith('.git/')) continue;
            if (name.startsWith('.github/')) continue;
            if (typeof content !== 'string') continue;
            fs.mkdirSync(path.dirname(name), { recursive: true });
            fs.writeFileSync(name, content, 'utf8');
            count++;
          }
          console.log(`wrote ${count} exported source files`);
          NODE
          cp /tmp/v59-vite.config.ts vite.config.ts

          rm -rf .bootstrap .bootstrap2 .bootstrap3 .bootstrap4 .bootstrap5 .bootstrap6 .finaltransport
          find .github/workflows -maxdepth 1 -type f ! -name 'import-v59-from-appdeploy.yml' -delete

          test "$(wc -l < src/App.tsx)" -ge 900
          test -f src/archiveData.ts
          test -f src/venice2026Complete.ts
          test -f src/photoEditionRosters.ts
          test -f src/index.css
          echo "source verification passed"

      - name: Build exact migrated source
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm run build
          test -f dist/index.html

      - name: Commit complete v59 migration
        run: |
          set -euo pipefail
          rm -rf dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Import complete AppDeploy v59 source and verify build'
            git push origin HEAD:v59-full
          fi
