name: Scan migration transport history

on:
  push:
    branches: [migration-expand]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-expand
          fetch-depth: 0

      - name: Find complete archives anywhere in git history
        shell: bash
        run: |
          set -u
          echo "COMMITS=$(git rev-list --all | wc -l)"
          declare -A seen
          declare -A best
          declare -A bestcommit

          for c in $(git rev-list --all --reverse); do
            for d in .bootstrap .bootstrap2 .bootstrap3 .bootstrap4 .bootstrap5 .bootstrap6 .finaltransport; do
              mapfile -t paths < <(git ls-tree -r --name-only "$c" -- "$d" 2>/dev/null | grep -E '^\.bootstrap[0-9]*/(chunk.*\.(b64|txt)|final-.*\.(b64|txt))$|^\.finaltransport/(chunk.*\.(b64|txt)|final-.*\.(b64|txt))$' | sort -V || true)
              n=${#paths[@]}
              [ "$n" -gt 0 ] || continue

              if [ "$n" -gt "${best[$d]:-0}" ]; then
                best[$d]=$n
                bestcommit[$d]=$c
              fi

              raw="/tmp/scan-$(echo "$d" | tr -cd '[:alnum:]').b64"
              : > "$raw"
              for p in "${paths[@]}"; do
                git show "$c:$p" >> "$raw" || true
              done
              tr -d '\r\n\t ' < "$raw" > "$raw.clean"
              key=$(sha256sum "$raw.clean" | cut -d' ' -f1)
              [ -z "${seen[$key]:-}" ] || continue
              seen[$key]=1

              bin="$raw.bin"
              if ! base64 -d "$raw.clean" > "$bin" 2>/dev/null; then
                continue
              fi

              bytes=$(wc -c < "$bin")
              kind=$(file -b "$bin" || true)
              valid=0
              archive=''
              out="/tmp/extract-$key"
              rm -rf "$out" && mkdir -p "$out"

              if xz -t "$bin" >/dev/null 2>&1 && tar -tJf "$bin" >/dev/null 2>&1; then
                archive='xz-tar'; tar -xJf "$bin" -C "$out"; valid=1
              elif gzip -t "$bin" >/dev/null 2>&1 && tar -tzf "$bin" >/dev/null 2>&1; then
                archive='gzip-tar'; tar -xzf "$bin" -C "$out"; valid=1
              elif unzip -t "$bin" >/dev/null 2>&1; then
                archive='zip'; unzip -q "$bin" -d "$out"; valid=1
              elif tar -tf "$bin" >/dev/null 2>&1; then
                archive='tar'; tar -xf "$bin" -C "$out"; valid=1
              fi

              if [ "$valid" -eq 1 ]; then
                files=$(find "$out" -type f | wc -l)
                app=$(find "$out" -type f -path '*/src/App.tsx' | head -1 || true)
                lines=0
                blob='MISSING'
                if [ -n "$app" ]; then
                  lines=$(wc -l < "$app")
                  blob=$(git hash-object "$app")
                fi
                echo "VALID commit=$c dir=$d parts=$n bytes=$bytes archive=$archive files=$files App_lines=$lines App_blob=$blob"
                find "$out" -maxdepth 2 -type f | sed "s#^$out/##" | sort | head -100
              else
                case "$kind" in
                  *XZ*|*gzip*|*Zip*|*tar*) echo "ARCHIVE-LIKE-INCOMPLETE commit=$c dir=$d parts=$n bytes=$bytes type=$kind" ;;
                esac
              fi
            done
          done

          echo "===== BEST PART COUNTS ====="
          for d in .bootstrap .bootstrap2 .bootstrap3 .bootstrap4 .bootstrap5 .bootstrap6 .finaltransport; do
            echo "$d best=${best[$d]:-0} commit=${bestcommit[$d]:-none}"
            if [ -n "${bestcommit[$d]:-}" ]; then
              git ls-tree -r --long --name-only "${bestcommit[$d]}" -- "$d" | sort -V | head -100
            fi
          done
