name: Expand Practice Index portable source v6

on:
  push:
    branches: ['migration-expand']
    paths:
      - '.bootstrap6/final-20-21.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration-expand
          fetch-depth: 0

      - name: Reassemble verified source archive
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .bootstrap6/chunk00.b64 \
            .bootstrap6/chunk01.b64 \
            .bootstrap6/final-02-03.b64 \
            .bootstrap6/final-04-05.b64 \
            .bootstrap6/final-06-07.b64 \
            .bootstrap6/final-08-09.b64 \
            .bootstrap6/final-10-11.b64 \
            .bootstrap6/final-12-13.b64 \
            .bootstrap6/final-14-15.b64 \
            .bootstrap6/final-16-17.b64 \
            .bootstrap6/final-18-19.b64 \
            .bootstrap6/final-20-21.b64; do
            test -f "$f"
          done
          cat \
            .bootstrap6/chunk00.b64 \
            .bootstrap6/chunk01.b64 \
            .bootstrap6/final-02-03.b64 \
            .bootstrap6/final-04-05.b64 \
            .bootstrap6/final-06-07.b64 \
            .bootstrap6/final-08-09.b64 \
            .bootstrap6/final-10-11.b64 \
            .bootstrap6/final-12-13.b64 \
            .bootstrap6/final-14-15.b64 \
            .bootstrap6/final-16-17.b64 \
            .bootstrap6/final-18-19.b64 \
            .bootstrap6/final-20-21.b64 > /tmp/practice-index.b64
          base64 --decode /tmp/practice-index.b64 > /tmp/practice-index.tar.xz
          echo "00563ee4d6288dadacd6bf54207ce5ca73f286f1ab2bfa89032870c50d6f78a8  /tmp/practice-index.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/practice-index.tar.xz -C .
          test -f src/App.tsx
          test -f src/data.ts
          test -f src/PracticeLineages.tsx
          test -f src/FieldDirectory.tsx
          test -f package.json
          test -f .github/workflows/deploy-pages.yml
          test "$(find src -type f | wc -l)" -ge 60
          grep -q "base: './'" vite.config.ts

      - name: Remove migration transport files
        shell: bash
        run: |
          rm -rf .bootstrap .bootstrap2 .bootstrap3 .bootstrap4 .bootstrap5 .bootstrap6 .finaltransport
          rm -f .github/workflows/bootstrap-migration.yml
          rm -f .github/workflows/bootstrap3-expand.yml
          rm -f .github/workflows/bootstrap4-expand.yml
          rm -f .github/workflows/bootstrap5-expand.yml
          rm -f .github/workflows/bootstrap6-expand.yml
          rm -f .github/workflows/export-bootstrap.yml
          rm -f .github/workflows/final-expand.yml

      - name: Commit expanded portable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Practice Index v59 GitHub migration"
          git push origin HEAD:migration-expand
